        "pcad": "# theme_design — Minefield 3D UI: dark theme found in CSS, light theme proposed\nspace oklab\nunits none deg\ngamut srgb\n\nvar stepL       = 0.03          # surface ramp, measured +0.030 / +0.020 (mean 0.03)\nvar hoverStep   = 0.07          # .btn -> .btn:hover measured +0.070 L\nvar mutedC      = 4.5   locked  # --muted on --bg: AA floor for secondary text\nvar linkC       = 0.17  shared  # --accent2 chroma, identical in every theme\nvar brandHoverL = 0.045         # --accent -> .btn.primary:hover measured +0.045 L\n\n# ---- inputs -------------------------------------------------------------\npoint canvas      at #0a0c11                anchor      # --bg, body background\npoint brand       at #ff9a3c                anchor      # --accent, primary button / flash\npoint warmth      at oklch(30% 0.03 265)    orientation # hue the panels/buttons lean to (264-269)\npoint readingGray at oklch(60% 0.012 264)   orientation # hue+chroma shared by text, muted, borders\n\n# ---- outputs (seeds = observed values from the dark CSS) ----------------\npoint surface1     at oklch(16.5% 0.014 264) derived    # --panel #0e1118, .mines-count, .hint\npoint surface2     at oklch(18.5% 0.016 264) derived    # .row input/select #10141c, .panel code\npoint surface3     at oklch(26.5% 0.024 265) derived    # .btn #1c2230\npoint surfaceHover at oklch(33.5% 0.048 269) derived    # .btn:hover #26304a\npoint text         at oklch(92.5% 0.006 265) derived    # --fg #e6e9ef\npoint textMuted    at oklch(62% 0.021 263)   derived    # --muted #8b93a5\npoint border       at oklch(35.5% 0.028 265) derived    # #2f3848 (.btn, inputs)\npoint borderMuted  at oklch(32% 0.027 266)   derived    # #2a3142 / #262e3d\npoint brandHover   at oklch(82.5% 0.12 64)   derived    # #ffb066\npoint onBrand      at oklch(14.5% 0.02 60)   derived    # #1a0f05 text on .btn.primary\npoint link         at oklch(65.5% 0.17 262)  derived    # --accent2 #4d8dff\npoint danger       at oklch(63% 0.21 25)     derived    # --danger #ff4646\npoint success      at oklch(80% 0.19 145)    derived    # .end.won h2 #3ddc5a\npoint arcane       at oklch(66% 0.19 300)    derived    # .collapses #b57bff\n\n# ---- surfaces: even lightness ramp above the canvas, one cool hue -------\ndL canvas surface1   = stepL\ndL surface1 surface2 = stepL\ndL surface2 surface3 = stepL\nlock H warmth surface1 surface2 surface3 surfaceHover weight 0.3\nlock C surface1 surface2 surface3\ndC canvas surface3 = 0.013            # measured 0.024 - 0.011\nlock C surface3 surfaceHover\ndL surface3 surfaceHover = hoverStep\n\n# ---- text and border family: one hue, lightness set by contrast --------\nlock H readingGray text textMuted border borderMuted\nlock C text textMuted\nC text = 0.008\nlock C border borderMuted\nC border = 0.027\ncontrast text canvas      >= 7         # AAA body text (currently 14.6:1)\ncontrast textMuted canvas >= mutedC    # AA secondary text (currently 6.0:1)\ncontrast border canvas    >= 3         # UI component minimum (currently ~2.0:1 - FAILS)\ndL borderMuted border = 0.035          # #2a3142 -> #2f3848\ndistance canvas text      -> min weight 0.05\ndistance canvas textMuted -> min weight 0.05\ndistance canvas border    -> min weight 0.05\n\n# ---- brand, its hover shade and its foreground -------------------------\nlock H brand brandHover onBrand\ndL brand brandHover = brandHoverL\ndC brand brandHover = -0.035\nC onBrand = 0.02\ncontrast onBrand brand >= 4.5          # label on the primary button\ndistance brand onBrand -> min weight 0.05\ncontrast brand canvas  >= 3            # accent used for borders and large text\n\n# ---- semantic hues, all measured as offsets from the brand hue ---------\ndH brand link    = -160                # 62 deg -> 262 deg (--accent2)\nC link = linkC\ncontrast link canvas >= 4.5\ndistance canvas link -> min weight 0.05\ndH brand danger  = -37                 # 62 deg -> 25 deg\nC danger = 0.21\ncontrast danger canvas >= 4.5\ndistance canvas danger -> min weight 0.05\ndH brand success = 83                  # 62 deg -> 145 deg\nC success = 0.19\ncontrast success canvas >= 4.5\ndistance canvas success -> min weight 0.05\ndH brand arcane  = -122                # 62 deg -> 300 deg\nC arcane = 0.19\ncontrast arcane canvas >= 4.5\ndistance canvas arcane -> min weight 0.05\n\n# ---- themes -------------------------------------------------------------\ntheme dark {                           # found: the whole current stylesheet\n  canvas at #0a0c11\n  brand  at #ff9a3c\n  warmth      at oklch(30% 0.03 265)\n  readingGray at oklch(60% 0.012 264)\n  var stepL = 0.03\n  var hoverStep = 0.07\n}\ntheme light {                          # proposed: no light scheme exists in the CSS\n  canvas      at oklch(97% 0.004 265)\n  brand       at oklch(62% 0.16 55)\n  warmth      at oklch(85% 0.02 265)\n  readingGray at oklch(45% 0.012 264)\n  var stepL = -0.025\n  var hoverStep = -0.05\n  text        at oklch(22% 0.008 264)  # seeds only: keep outputs on the dark side\n  textMuted   at oklch(45% 0.008 264)\n  border      at oklch(60% 0.027 264)\n  borderMuted at oklch(64% 0.027 264)\n  link        at oklch(48% 0.17 262)\n  danger      at oklch(50% 0.21 25)\n  success     at oklch(48% 0.19 145)\n  arcane      at oklch(50% 0.19 300)\n  onBrand     at oklch(20% 0.02 60)\n}\n\nsolver gauss-newton iterations 200 tolerance 1e-6\nview camera (300, 250, 400) target (0, 0, 200) up (0, 0, 1) perspective\nview grid none show labels axes hide seeds\n",

link | 0.17 in the only theme | design decision |\n| `contrast link canvas >= 4.5` | `--accent2` text | 6.6:1 | holds |\n| `dH brand danger = -37` | danger | 62° → 25° | holds |\n| `dH brand success = 83` | success | 62° → 145° | holds |\n| `dH brand arcane = -122` | arcane | 62° → 300° | holds |\n| `contrast {danger,success,arcane} canvas >= 4.5` | status text | 5.9 / 10.5 / 6.4 :1 | holds |\n| `distance canvas X -> min weight 0.05` | text, textMuted, border, link, danger, success, arcane | — | design decision: stay as close to the canvas as the floor allows, so the solver never over-darkens/over-brightens |",

          "expected": "*Export CSS* writes `/* Point-CAD theme — 16 colours, themes: dark, light */`, then `:root { … }` with the **dark** solve (the default theme), then `@media (prefers-color-scheme: dark) { :root { … } }`, then `[data-theme=\"dark\"]` and `[data-theme=\"light\"]` blocks. Each block lists all 16 exported points as `--color-<kebab>: oklch(L% C H);` — `warmth` and `readingGray` are orientation points and never appear.\n\nExpected log after *Solve themes*: `solve: converged=true iterations=<n> residual<1e-6  dark: 0 unmet · light: 0 unmet`.\n\nDerived tokens expected to move more than ΔE 0.05 from their seed, and why:\n\n| theme | token | move | rule responsible |\n|---|---|---|---|\n| dark | `surface3` | lighter/darker by ~0.05 L | the regularised `dL … = stepL` ramp (`.btn` was two steps up) |\n| dark | `border` | lighter by ~0.15 L | `contrast border canvas >= 3` (the CSS fails this at ~2.0:1) |\n| dark | `borderMuted` | follows `border` | `dL borderMuted border = 0.035` |\n| dark | `text` | possibly darker | `distance canvas text -> min` pulls it toward the 7:1 floor; add `L text >= 0.90` if the current `#e6e9ef` must be kept |\n| dark | `onBrand` | lighter | `distance brand onBrand -> min` at the 4.5:1 floor |\n| light | all derived | n/a (no observed values) | proposed theme, solved from anchors + seeds |\n\n`preview.css` / `preview.html` exercise: the ramp `canvas → surface1 → surface2 → surface3 → surfaceHover` as nested panels and a hovered button; `text`, `textMuted`, `link`, `danger`, `success`, `arcane` as foregrounds on those surfaces; `brand`/`brandHover`/`onBrand` as the primary button and its hover state; `border`/`borderMuted` as panel and hint outlines.",

ackground: color-mix(in oklab, var(--color-canvas) 90%, transparent)` |\n| `rgba(10,12,17,.7)` | `hud.css` `.hint` ×1 | background | `canvas` | `background: color-mix(in oklab, var(--color-canvas) 70%, transparent)` |\n| `rgba(255,255,255,.08)` | `hud.css` `.mines-ring` ×1 | conic stop | `text` | `color-mix(in oklab, var(--color-text) 8%, transparent)` |\n| `#b57bff` | `hud.css` `.collapses` ×1 | color | `arcane` | `color: var(--color-arcane)` |\n| `#262e3d` | `hud.css` `.hint` ×1 | border-color | `borderMuted` | `border: 1px solid var(--color-border-muted)` |\n| `rgba(255,154,60,.15)` | `hud.css` `.flash` ×1 | background | `brand` | `background: color-mix(in oklab, var(--color-brand) 15%, transparent)` |\n| `rgba(255,255,255,.85)` | `hud.css` `.crosshair::before/after` ×2 | background | — | keep literal (`mix-blend-mode: difference`) |\n\n**Deletions:** none — the stylesheet has no per-theme overrides today. Once the token file ships, the six `--bg/--panel/--fg/--muted/--accent/--accent2/--danger` aliases in `:root` may be deleted and their `var()` users repointed at `--color-*` directly; keeping them as one-line aliases is the lower-risk first step and is what the table above does.",

          "plumbing": "The stylesheets currently have **no theme switching at all** — a single dark palette in `:root`. Adopt both mechanisms the emitter produces:\n\n```html\n<link rel=\"stylesheet\" href=\"styles/minefield-3d-ui-tokens.css\">\n<link rel=\"stylesheet\" href=\"styles/main.css\">\n<link rel=\"stylesheet\" href=\"styles/hud.css\">\n```\n\n1. Load the token file **first**; `main.css` and `hud.css` then only consume `var(--color-*)`.\n2. `:root` in the token file carries the **dark** theme (`defaultTheme: dark`), so the app looks exactly as it does now with no attribute set.\n3. `@media (prefers-color-scheme: dark) { :root { … } }` is emitted for the `dark` theme and is a no-op against the default — harmless, and it keeps the export standard.\n4. `[data-theme=\"light\"]` / `[data-theme=\"dark\"]` on `<html>` gives the explicit override. If a light default is ever wanted, put the `light` block in `:root` by reordering the themes in the sketch, not by editing the CSS.\n5. Add to `main.css` `:root`: `color-scheme: dark light;` so scrollbars, `select` popups and `input[type=range]` follow the theme. With `[data-theme=\"light\"]` set, override it to `color-scheme: light dark`.\n6. `#scene` (the WebGL canvas) and any clear colour set in JS should read `--color-canvas` via `getComputedStyle(document.documentElement)` rather than hard-coding `#0a0c11`.",

          "alpha": "Five declarations use a token colour at partial alpha. Express them with `color-mix` so the theme follows:\n\n| original | replacement |\n|---|---|\n| `rgba(14,17,24,.94)` | `color-mix(in oklab, var(--color-surface-1) 94%, transparent)` |\n| `rgba(10,12,17,.9)` | `color-mix(in oklab, var(--color-canvas) 90%, transparent)` |\n| `rgba(10,12,17,.7)` | `color-mix(in oklab, var(--color-canvas) 70%, transparent)` |\n| `rgba(255,154,60,.15)` | `color-mix(in oklab, var(--color-brand) 15%, transparent)` |\n| `rgba(255,255,255,.08)` | `color-mix(in oklab, var(--color-text) 8%, transparent)` |\n\nDerived shades that were **not** promoted to tokens (none are needed today; `.btn:hover` and `.btn.primary:hover` both became tokens) can use relative colour syntax, e.g. `oklch(from var(--color-surface-3) calc(l + 0.07) c h)`.\n\n`box-shadow: 0 20px 60px rgba(0,0,0,.6)` and the `.overlay` scrim stay literal black; they are depth cues, not palette members. `.crosshair` uses `rgba(255,255,255,.85)` with `mix-blend-mode: difference` — it must stay pure white to invert correctly.\n\nDuring the transition write `var(--color-text, #e6e9ef)` (the `fallback` flag is on, and `preview.css` shows the pattern) so the UI is correct even if the token file fails to load.",

          "skip": "Do **not** tokenise:\n\n- `transparent` (`.btn.primary` border-color) and any `currentColor` — not colours.\n- `rgba(0,0,0,.55)` (`.overlay`) and `rgba(0,0,0,.6)` (`.panel` shadow) — pure black scrim and shadow; they read correctly over any theme.\n- `rgba(255,255,255,.85)` (`.crosshair`) — required to be white for `mix-blend-mode: difference`.\n- Colours produced by the WebGL scene itself (materials, lights) — outside the stylesheet scope; only the clear colour should be wired to `--color-canvas`.\n- `system-ui` font stacks, `backdrop-filter`, `mix-blend-mode` — not colour.\n\nNo third-party stylesheets exist in this tree, so nothing was skipped for ownership reasons.",

          "order": "1. Add `styles/minefield-3d-ui-tokens.css` (from *Save CSS*) and link it before `main.css`.\n2. Repoint the seven aliases in `main.css` `:root` (`--bg`, `--panel`, `--fg`, `--muted`, `--accent`, `--accent2`, `--danger`) at the matching `--color-*` tokens. The page should look identical.\n3. Replace the remaining literals in `main.css`, then in `hud.css`, per the replacement table — one property class at a time (`background`, then `border-color`, then `color`).\n4. Convert the five alpha uses to `color-mix` (see *Alpha*).\n5. Add `color-scheme: dark light` to `:root`; verify scrollbars and `select` popups.\n6. State tokens: confirm `.btn:hover`, `.btn.primary:hover` and `.btn.active` (outline uses `--accent`) read from `--color-surface-hover`, `--color-brand-hover`, `--color-brand`.\n7. Wire the renderer clear colour to `--color-canvas`.\n8. Optionally delete the alias layer and use `--color-*` directly.\n9. Remove the `var(--color-x, <literal>)` fallbacks once the token file ships unconditionally.\n\nSteps 1–4 leave the page pixel-identical provided the sketch is solved with the `-> min` objectives disabled (or with `border`'s contrast floor relaxed); step 3 is where the deliberate changes listed in *Expected* land.",

          "findings": "**Accessibility**\n\n1. `border` (`#2f3848`) on `canvas` (`#0a0c11`) measures **~2.0:1**, below the 3:1 non-text minimum. The sketch writes `contrast border canvas >= 3`, so the solver will lighten it (roughly to `L ≈ 0.50`). This is a visible change to every `.btn`, `.panel` and `.row input` outline — accept it or replace the floor with `L border = 0.355` to keep today's look.\n2. `.hint` puts `--muted` (`#8b93a5`) on `rgba(10,12,17,.7)` over the 3D scene. Against the opaque canvas it is 6.0:1, but over a bright scene the effective ratio is unknown. Not expressible as a constraint; recommend raising the hint background to `.85` alpha.\n3. `.btn.primary` uses `#1a0f05` on `#ff9a3c` (8.9:1, fine), but `distance brand onBrand -> min` will lighten the label to the 4.5:1 floor. If the near-black label is intentional, drop that objective.\n\n**Merges and judgement calls**\n\n4. `#2a3142` (`.panel`) and `#262e3d` (`.hint`) were merged into `borderMuted` (ΔE_ok 0.012).\n5. `#0a0c11` appears as an opaque background *and* at .9/.7 alpha in the HUD; all three are one cluster, `canvas`.\n6. `surface2` (`#10141c`) and `surface1` (`#0e1118`) are only 0.02 L apart; the regularised ramp keeps them distinct at `stepL = 0.03`, which slightly separates panels from inputs.\n7. `.btn` (`#1c2230`) sits ~2 ramp steps above `surface2`; the even-ramp rule moves it one step. Flagged as a design decision, not a measured relation.\n\n**Near-neutrals**\n\n8. `text` (`C = 0.006`) is below the `C < 0.02` reliability threshold, so its hue is numerically meaningless. The whole gray family takes its hue from the `readingGray` **orientation point** (264°), not from `#e6e9ef` itself.\n\n**Themes**\n\n9. The `light` theme is **proposed** — nothing in the CSS switches schemes. Its block contains only anchors, orientation points, the two ramp variables and seeds on the correct (dark) side of the canvas; every value is derived by the solver and none of it is claimed as observed.\n\n**Hues not forced into clean relationships**\n\n10. `link` sits 160° from `brand`, not a 180° complement; `danger`/`success`/`arcane` sit at −37°/+83°/−122°. The measured arcs are pinned rather than rounded, because rounding `link` to 180° would shift `--accent2` off the blue the HUD ring and `code` colour rely on.\n\n**Not written**\n\n11. No `apca` constraints — the WCAG floors already bind, and mixing the two metrics would double-constrain lightness.\n12. No rule ties `brand` to `canvas`; the brand colour is a free anchor by definition.\n13. Out-of-gamut literals: none. Every literal is sRGB hex/rgba, and `gamut srgb` stays on.",

            "css": "body { margin: 0; padding: 24px; font: 14px/1.6 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  background: var(--color-canvas, #0a0c11); color: var(--color-text, #e6e9ef); }\nh2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }\n.muted { color: var(--color-text-muted, #8b93a5); }\na { color: var(--color-link, #4d8dff); }\ncode { background: var(--color-surface-2, #10141c); color: var(--color-link, #4d8dff);\n  padding: 2px 6px; border-radius: 4px; }\n.panel { background: var(--color-surface-1, #0e1118); border: 1px solid var(--color-border-muted, #2a3142);\n  border-radius: 12px; padding: 16px; margin: 12px 0; }\n.panel .panel { background: var(--color-surface-2, #10141c); }\n.panel .panel .panel { background: var(--color-surface-3, #1c2230); }\n.btn { display: inline-block; background: var(--color-surface-3, #1c2230); color: var(--color-text, #e6e9ef);\n  border: 1px solid var(--color-border, #2f3848); border-radius: 8px; padding: 8px 14px; cursor: pointer; }\n.btn:hover { background: var(--color-surface-hover, #26304a); }\n.btn.primary { background: var(--color-brand, #ff9a3c); color: var(--color-on-brand, #1a0f05);\n  border-color: transparent; font-weight: 600; }\n.btn.primary:hover { background: var(--color-brand-hover, #ffb066); }\n.btn.active { outline: 2px solid var(--color-brand, #ff9a3c); }\n.hint { display: inline-block; border: 1px solid var(--color-border-muted, #262e3d); border-radius: 999px;\n  padding: 6px 14px; color: var(--color-text-muted, #8b93a5); font-size: .85em; }\n.lost { color: var(--color-danger, #ff4646); }\n.won { color: var(--color-success, #3ddc5a); }\n.collapses { color: var(--color-arcane, #b57bff); letter-spacing: .05em; }\n.ring { --p: 62; width: 64px; height: 64px; border-radius: 50%; padding: 5px;\n  background: conic-gradient(var(--color-link, #4d8dff) calc(var(--p) * 1%),\n    color-mix(in oklab, var(--color-text, #e6e9ef) 8%, transparent) 0); }\n.ring span { display: flex; width: 100%;             "html": "<h2>Minefield 3D — palette check<\/h2>\n<p>Body text on <code>canvas<\/code>. <span class=\"muted\">HUD captions use <code>textMuted<\/code>.<\/span> A <a href=\"#\">link<\/a> carries <code>--color-link<\/code>.<\/p>\n<div class=\"panel\">\n  <b>surface1<\/b> — overlay panel\n  <div class=\"panel\">\n    <b>surface2<\/b> — inputs and <code>code<\/code>\n    <div class=\"panel\"><b>surface3<\/b> — buttons; three even lightness steps above the canvas.<\/div>\n  <\/div>\n<\/div>\n<p>\n  <span class=\"btn\">Hover me<\/span>\n  <span class=\"btn primary\">Start run<\/span>\n  <span class=\"btn active\">Layer 3<\/span>\n<\/p>\n<p><span class=\"hint\">Right-click to flag · scroll to change layer<\/span><\/p>\n<p><span class=\"collapses\">collapses 2/3<\/span> · <b class=\"won\">Cleared<\/b> · <b class=\"lost\">Detonated<\/b><\/p>\n<div class=\"ring\"><span>07<\/span><\/div>\n<p class=\"muted\">Every colour above is a solved point in OKLab; edit an anchor or a rule in the Script window and press <b>Solve themes<\/b>.<\/p>\n"

    <script type="module">
      import { bootHarness } from 'https://math.cognotik.com/experiments/point-cad/extensions/theme/ui/harness.js';

      /* ------------------------------------------------------------------

       pcad sketch immediately before the `solver` line. A theme only ever
       declares the two anchors (canvas, brand), the two orientation points

       derived points. No rule is relaxed: the even surface ramp, the gray
       family hue lock, the contrast floors and the measured hue arcs are
       re-solved for every palette, so all of them obey one design system.
       ------------------------------------------------------------------ */

      const LIGHT_STEP = -0.025,
        LIGHT_HOVER = -0.05;

      function themeBlock([name, note, mode, canvas, brand, warmth, gray]) {
        const light = mode === 'light';
        const gh = wrap(gray[2]);
        const bh = wrap(brand[2]);

        // seeds only: put every derived point on the correct side of the canvas
        const s = light
          ? { text: 0.22, muted: 0.45, border: 0.6, borderMuted: 0.565, semantic: 0.5 }
          : { text: 0.93, muted: 0.63, border: 0.5, borderMuted: 0.465, semantic: 0.7 };
        const onBrandL = brand[0] >= 0.6 ? 0.16 : 0.95; // label that can still clear 4.5:1

        return [
          `theme ${name} {${' '.repeat(Math.max(1, 22 - name.length))}# ${note}`,
          `  canvas      at ${ok(canvas)}`,
          `  brand       at ${ok(brand)}`,
          `  warmth      at ${ok(warmth)}`,
          `  readingGray at ${ok(gray)}`,
          `  var stepL = ${light ? LIGHT_STEP : DARK_STEP}`,
          `  var hoverStep = ${light ? LIGHT_HOVER : DARK_HOVER}`,
          `  text        at ${ok([s.text, 0.008, gh])}`,
          `  textMuted   at ${ok([s.muted, 0.008, gh])}`,
          `  border      at ${ok([s.border, 0.027, gh])}`,
          `  borderMuted at ${ok([s.borderMuted, 0.027, gh])}`,
          `  link        at ${ok([s.semantic, 0.17, bh - 160])}`,
          `  danger      at ${ok([s.semantic, 0.21, bh - 37])}`,
          `  success     at ${ok([s.semantic, 0.19, bh + 83])}`,
          `  arcane      at ${ok([s.semantic, 0.19, bh - 122])}`,
          `  onBrand     at ${ok([onBrandL, 0.02, bh])}`,
          `}`,
        ].join('\n');
      }

      const node = document.getElementById('theme-doc');
      const payload = JSON.parse(node.textContent);

      const pack = MULTIVERSE.map(themeBlock).join('\n');
      const at = payload.pcad.lastIndexOf('\nsolver ');
      payload.pcad =
        at < 0
          ? `${payload.pcad}\n${pack}\n`
          : `${payload.pcad.slice(0, at + 1)}${pack}\n\n${payload.pcad.slice(at + 1)}`;

      const lightCount = MULTIVERSE.filter((t) => t[2] === 'light').length;
      const darkCount = MULTIVERSE.length - lightCount;
      const total = MULTIVERSE.length + 2;

      payload.doc.summary +=
        `\n- **Multiverse palette pack:** ${total} themes total — \`dark\` (found), \`light\` ` +

        `\n\n7. With the pack loaded the emitter writes a \`[data-theme="<name>"]\` block for every ` +
        `palette (\`ukiyoe\`, \`kente\`, \`marrakech\`, … \`spice\`). \`:root\` still carries \`dark\`, and ` +
        `\`@media (prefers-color-scheme: light)\` maps to \`light\`, so the default behaviour is unchanged; ` +
        `everything else is opt-in via the attribute.\n` +
        `8. Set \`color-scheme\` per block — \`light dark\` for the ${lightCount} light-canvas palettes, ` +
        `\`dark light\` for the ${darkCount} dark ones — so native controls follow the chosen strand.\n` +
        `9. The token file grows to ~${total * 16} declarations. If that matters, ship \`:root\` + the two ` +
        `default themes in the critical CSS and lazy-load the pack as a second stylesheet.`;

      payload.doc.findings +=
        `\n\n**Multiverse pack**\n\n` +
        `14. Every added theme is **proposed**, not observed — the stylesheet contains exactly one ` +
        `palette. Only \`canvas\` and \`brand\` are authored per theme; everything else is solver output.\n` +
        `15. The brand hue drives the whole semantic set through \`dH brand {link,danger,success,arcane}\`. ` +

        `in cool-brand palettes (\`azulejo\`, \`porcelain\`, \`ndebele\`) the same −160° arc swings \`link\` ` +
        `into the yellows. If a blue link is required everywhere, replace the arc with \`H link = 262\` ` +
        `for those themes rather than editing the anchor.\n` +
        `16. Light-canvas palettes keep \`brand\` at L ≤ 0.58 so the fixed anchors can satisfy ` +
        `\`contrast brand canvas >= 3\`; a brighter brand on a near-white canvas is unsatisfiable by ` +
        `definition, since both points are anchored.\n` +
        `17. \`onBrand\` is seeded dark for bright brands and near-white for deep ones. The ` +
        `\`distance brand onBrand -> min\` objective will still pull it to the 4.5:1 floor; drop that ` +
        `objective if a particular strand wants a high-contrast label.\n` +
        `18. Chromatic canvases (\`marrakech\` at C 0.10, \`nile\` at C 0.09) make \`dC canvas surface3 = 0.013\` ` +
        `read as a *relative* step, so the surfaces stay tinted rather than drifting grey — this is the ` +
        `point of keeping the rule as a delta instead of an absolute \`C\`.`;

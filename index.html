    <link href="./styles/main.css" rel="stylesheet" />
    <link href="./styles/hud.css" rel="stylesheet" />
    <script>
      // Paint the saved strand before the first frame so there is no flash of the
      // default vault. 'auto' (or nothing saved) leaves :root + the media query in charge.
      try {
        const t = JSON.parse(localStorage.getItem('mineminer.settings') || '{}').theme;
        if (t && t !== 'auto') document.documentElement.dataset.theme = t;
      } catch {
        /* storage unavailable */
      }
    </script>
    <script type="importmap">

          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
